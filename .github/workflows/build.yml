name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        shell: pwsh
        run: dotnet build MergeBlockProjectionFix.csproj -c Release

      - name: Verify assembly contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'bin\Release\net48'
          $plugin = Join-Path $bin 'MergeBlockProjectionFix.dll'
          $harmony = Join-Path $bin '0Harmony.dll'
          if (!(Test-Path $plugin)) { throw "Plugin DLL missing: $plugin" }
          if (!(Test-Path $harmony)) { throw "Harmony DLL missing: $harmony" }

          $asm = [Reflection.Assembly]::ReflectionOnlyLoadFrom($plugin)
          $vrage = $asm.GetReferencedAssemblies() | Where-Object Name -eq 'VRage'
          if ($null -eq $vrage) { throw 'Plugin does not reference VRage' }
          if ($vrage.Version.ToString() -ne '1.0.0.0') {
            throw "Unexpected VRage reference version: $($vrage.Version)"
          }
          if ($vrage.GetPublicKeyToken().Length -ne 0) {
            throw 'Unexpected strong-named VRage reference'
          }

          "Plugin: $($asm.FullName)"
          "VRage reference: $($vrage.FullName)"
          Get-FileHash $plugin -Algorithm SHA256
          Get-FileHash $harmony -Algorithm SHA256

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'bin\Release\net48'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item (Join-Path $bin 'MergeBlockProjectionFix.dll') $out
          Copy-Item (Join-Path $bin '0Harmony.dll') $out
          Copy-Item 'README.md' $out
          Get-FileHash (Join-Path $out 'MergeBlockProjectionFix.dll') -Algorithm SHA256 | Out-File (Join-Path $out 'SHA256.txt')
          Get-FileHash (Join-Path $out '0Harmony.dll') -Algorithm SHA256 | Out-File (Join-Path $out 'SHA256.txt') -Append
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'MergeBlockProjectionFix.zip') -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MergeBlockProjectionFix
          path: |
            artifact/*
            MergeBlockProjectionFix.zip
          if-no-files-found: error
